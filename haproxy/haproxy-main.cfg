global
    log stdout format raw local0
    maxconn 4096
    user haproxy
    group haproxy
    chroot /
    ssl-default-bind-options ssl-min-ver TLSv1.2


defaults
    log global
    mode http

    option httplog
    option dontlognull
    option forwardfor

    retries 3

    timeout http-request 30s
    timeout connect 10s
    timeout client 300s
    timeout server 300s
    timeout http-keep-alive 30s
    timeout tunnel 1h


# EN: Docker embedded DNS. Backends are addressed by Compose service name.
# RU: Встроенный Docker DNS. Backends адресуются по имени Compose-сервиса.
resolvers docker
    nameserver docker 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold other 10s
    hold refused 10s
    hold nx 10s
    hold timeout 10s
    hold obsolete 10s


frontend http_in
    bind :80
    mode http
    http-request redirect scheme https code 308


frontend https_in
    bind :443 ssl crt /etc/haproxy/certs/haproxy.pem alpn h2,http/1.1
    mode http

    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port 443
    http-request set-header X-Forwarded-Host %[req.hdr(host)]

    acl host_matrix hdr(host) -i "${HAPROXY_MATRIX_HOST}" "${HAPROXY_MATRIX_HOST}:443"
    acl host_mas hdr(host) -i "${HAPROXY_MAS_HOST}" "${HAPROXY_MAS_HOST}:443"
    acl host_element hdr(host) -i "${HAPROXY_ELEMENT_HOST}" "${HAPROXY_ELEMENT_HOST}:443"
    acl host_panel hdr(host) -i "${HAPROXY_PANEL_HOST}" "${HAPROXY_PANEL_HOST}:443"
    acl host_rtc_jwt hdr(host) -i "${HAPROXY_RTC_JWT_HOST}" "${HAPROXY_RTC_JWT_HOST}:443"
    acl host_rtc hdr(host) -i "${HAPROXY_RTC_HOST}" "${HAPROXY_RTC_HOST}:443"

    # EN: MAS compatibility endpoints must win before normal Matrix -> Synapse routing.
    # RU: Compatibility endpoints MAS должны иметь приоритет над обычным Matrix -> Synapse routing.
    acl mas_compat path_reg ^/_matrix/client/[^/]+/(login|logout|refresh)(/.*)?$
    use_backend mas if host_matrix mas_compat

    use_backend synapse if host_matrix
    use_backend mas if host_mas
    use_backend element if host_element
    use_backend element_admin if host_panel
    use_backend rtc_jwt if host_rtc_jwt
    use_backend livekit if host_rtc

    default_backend not_found


backend synapse
    mode http
    option httpchk GET /_matrix/client/versions
    http-check expect status 200
    server synapse synapse:8008 check resolvers docker init-addr last,libc,none


backend mas
    mode http
    option httpchk GET /.well-known/openid-configuration
    http-check expect status 200
    server mas mas:8080 check resolvers docker init-addr last,libc,none


backend element
    mode http
    option httpchk GET /config.json
    http-check expect status 200
    server element element:80 check resolvers docker init-addr last,libc,none


backend element_admin
    mode http
    server element_admin element-admin:8080 check resolvers docker init-addr last,libc,none


backend rtc_jwt
    mode http
    option httpchk GET /healthz
    http-check expect status 200
    server rtc_jwt lk-jwt-service:8080 check resolvers docker init-addr last,libc,none


backend livekit
    mode http
    timeout server 1h
    timeout tunnel 1h
    server livekit livekit:7880 check resolvers docker init-addr last,libc,none


backend not_found
    mode http
    http-request return status 404 content-type text/plain string "Unknown virtual host"
